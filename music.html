<div class="music-widget" id="music-widget">
  
  <audio id="audio-player" src="https://nsy638.github.io/mine/Doyou.mp3"></audio>

  <div class="icon-circle" id="icon-circle">
    <svg viewBox="0 0 24 24" class="music-icon" id="icon-play">
      <path d="M19 17H17V5c0-.55-.45-1-1-1H8c-.55 0-1 .45-1 1v12H5c-.55 0-1 .45-1 1s.45 1 1 1h14c-.55 0 1-.45 1-1s-.45-1-1-1z"/>
    </svg>
    <svg viewBox="0 0 24 24" class="music-icon" id="icon-pause" style="display: none;">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
  </div>
  
  <div class="text-container">
    <div class="music-title">Do You Believe in Magic?</div>
    <div class="music-artist">Lee Eul</div>
  </div>
</div>

<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #ffffff; 
  }

  /* 🛠️ 전체 크기 및 여백 축소 */
  .music-widget {
    font-family: 'Pretendard', sans-serif;
    display: flex;
    align-items: center;
    background-color: #ffffff;
    
    padding: 10px 24px 10px 12px; /* 위아래, 우측 여백 대폭 축소 (기존 14px 40px) */
    border-radius: 100px; 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
    border: 1px solid #f3f3f3;
    width: fit-content;
    min-width: 210px;             /* 최소 가로폭 축소 (기존 260px) */
    
    cursor: pointer; 
    user-select: none; 
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .music-widget:active {
    transform: scale(0.98);
  }

  /* 🛠️ 아이콘이 들어가는 원 크기 축소 */
  .icon-circle {
    width: 34px;          /* 크기 축소 (기존 44px) */
    height: 34px;         /* 크기 축소 (기존 44px) */
    background-color: #F4F4F4;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 12px;   /* 글자와의 간격 축소 (기존 18px) */
    flex-shrink: 0;
  }

  .music-widget.playing .icon-circle {
    animation: rotateHat 4s linear infinite;
  }

  /* 🛠️ 마술모자 아이콘 크기 축소 */
  .music-icon {
    width: 15px;          /* 크기 축소 (기존 18px) */
    height: 15px;
  }

  .text-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
  }

  /* 🛠️ 노래 제목 글자 크기 축소 */
  .music-title {
    font-size: 0.95rem;   /* 크기 축소 (기존 1.05rem) */
    font-weight: 600;
    color: #555E6B; 
    margin-bottom: 2px;
    line-height: 1.2;
    letter-spacing: -0.3px;
  }

  /* 🛠️ 가수 이름 글자 크기 축소 */
  .music-artist {
    font-size: 0.8rem;    /* 크기 축소 (기존 0.9rem) */
    font-weight: 400;
    color: #A1B1C2; 
    line-height: 1.2;
    letter-spacing: -0.3px;
  }

  @keyframes rotateHat {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<script>
  const widget = document.getElementById('music-widget');
  const audio = document.getElementById('audio-player');
  const playIcon = document.getElementById('icon-play');
  const pauseIcon = document.getElementById('icon-pause');

  widget.addEventListener('click', function() {
    if (audio.paused) {
      audio.play();
      widget.classList.add('playing');
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      audio.pause();
      widget.classList.remove('playing');
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  });

  audio.addEventListener('ended', function() {
    widget.classList.remove('playing');
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  });
</script>
