<!-- Responsive 16:9 cropped, rounded-corner image with responsive bottom text -->
<div class="responsive-img">
  <img src="https://i.ibb.co/pBB260yX/IMG-20260626-194902-253-27.png" alt="16:9 image" />
  <div class="overlay-text">- REwrite our shattered lives,<br>DO whatever.</div>
</div>

<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  .responsive-img {
    position: relative;
    width: 100%;              
    aspect-ratio: 16 / 9;     
    border-radius: 20px;      
    overflow: hidden;         
    margin: auto;             
  }

  .responsive-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* 텍스트 오버레이 (살짝 더 작은 반응형 크기 + 얇은 테두리) */
  .overlay-text {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%) skewX(-15deg);
    color: #FFD700;
    -webkit-text-stroke: 1.5px black;
    font-family: 'Pretendard Black', 'Pretendard', sans-serif;
    font-size: clamp(1.5rem, 4vw, 3rem); /* 👈 아주 살짝 작게 조정 */
    font-weight: 900;
    text-align: center;

    width: 100%;       
    white-space: nowrap;   
    line-height: 1.2;

    opacity: 0;
    animation: fadeIn 2s ease forwards;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    z-index: 10;
  }

  /* 페이드인 애니메이션 */
  @keyframes fadeIn {
    0% { opacity: 0; transform: translate(-50%, 10%) skewX(-15deg); }
    100% { opacity: 1; transform: translate(-50%, 0) skewX(-15deg); }
  }

  /* aspect-ratio 미지원 브라우저용 폴백 */
  @supports not (aspect-ratio: 16 / 9) {
    .responsive-img {
      position: relative;
      padding-top: calc(100% * 9 / 16);
    }
    .responsive-img img,
    .overlay-text {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  }
</style>
